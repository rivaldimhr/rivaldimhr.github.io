<!DOCTYPE html>
<html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<title>3D Portfolio — coming soon</title>
<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@500;800&display=swap" rel="stylesheet">
<style>
body{margin:0;min-height:100vh;display:grid;place-items:center;background:#2E4A33;color:#fff;font-family:"Plus Jakarta Sans",system-ui,sans-serif;text-align:center;padding:24px;box-sizing:border-box}
.cube{width:90px;height:90px;margin:0 auto 34px;position:relative;transform-style:preserve-3d;transform:rotateX(-25deg) rotateY(35deg)}
.cube div{position:absolute;inset:0;border:3px solid #F5B40A;background:rgba(245,180,10,.12)}
.cube div:nth-child(1){transform:translateZ(45px)}.cube div:nth-child(2){transform:rotateY(180deg) translateZ(45px)}
.cube div:nth-child(3){transform:rotateY(90deg) translateZ(45px)}.cube div:nth-child(4){transform:rotateY(-90deg) translateZ(45px)}
.cube div:nth-child(5){transform:rotateX(90deg) translateZ(45px)}.cube div:nth-child(6){transform:rotateX(-90deg) translateZ(45px)}
@media (prefers-reduced-motion:no-preference){.cube{animation:r 8s linear infinite}@keyframes r{to{transform:rotateX(-25deg) rotateY(395deg)}}}
h1{font-size:clamp(34px,6vw,56px);margin:0;font-weight:800}h1 span{color:#F5B40A}
p{color:#D3DDD0;max-width:42ch;margin:14px auto 30px;line-height:1.6}
a{display:inline-block;background:#F5B40A;color:#2E4A33;font-weight:800;padding:14px 26px;border-radius:999px;text-decoration:none}
</style></head><body><main>
<div class="cube" aria-hidden="true"><div></div><div></div><div></div><div></div><div></div><div></div></div>
<h1>3D portfolio is <span>coming soon</span></h1>
<p>An interactive 3D version of this portfolio is being built. In the meantime, the classic version has everything.</p>

</main></body></html>
